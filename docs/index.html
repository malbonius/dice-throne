<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161923">
<title>Dice Throne · Match prototype</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10121a;color:#f5f1e9;--panel:#1a1e29;--line:#343a4a;--muted:#bac0ce;--gold:#f2c579}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button{color:inherit;background:#282f40;border:1px solid #465069;border-radius:9px;min-height:44px;padding:7px 12px}button:hover:not(:disabled){background:#374258}button:disabled{opacity:.53;cursor:default}button.primary{background:var(--gold);color:#221809;border-color:var(--gold);font-weight:750}button.primary:hover:not(:disabled){background:#ffdf9e}button[aria-pressed=true]{border-color:var(--gold)}
header{border-bottom:1px solid var(--line);background:#161923}header>div{max-width:1650px;margin:auto;padding:14px clamp(12px,3vw,42px);display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-family:Georgia,serif;font-size:clamp(1.35rem,3vw,2rem);margin:0}header small{color:var(--muted)}
main{max-width:1650px;margin:auto;padding:clamp(10px,2.5vw,32px);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.84fr) minmax(0,1fr);gap:14px;align-items:start}
.hero,.arena{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.hero-head{padding:12px;display:flex;flex-wrap:wrap;gap:7px 14px;align-items:center;border-top:3px solid var(--hero)}.hero h2{font-family:Georgia,serif;font-size:1.35rem;margin:0 auto 0 0}.hero strong{color:var(--hero);white-space:nowrap}.board-panel{margin:0}.board-panel img{width:100%;display:block;height:auto}.board-panel figcaption{padding:9px 12px;color:var(--muted);font-size:.82rem}
.inventory{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:.85rem}.deck{display:flex;align-items:center;gap:7px}.deck img{width:21px;height:33px;object-fit:contain}.tokens{flex-basis:100%;display:flex;min-height:21px;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}.token{display:inline-flex;align-items:center;gap:5px}.token img{width:19px;height:19px}
.arena{padding:14px}.phase{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--gold);font-size:.9rem}.arena h2{font-size:1.21rem;margin:9px 0 5px}.arena p{margin:5px 0 12px;color:var(--muted);font-size:.9rem}.dice{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}.die{display:grid;place-items:center;width:100%;padding:4px;aspect-ratio:1;min-height:0;border-radius:9px;background:#242937;border:1px solid #51566a}.die img{width:100%;border-radius:4px;display:block}.die[aria-pressed=true]{background:#665132;border-color:var(--gold)}.die:disabled{opacity:1;cursor:default}.empty{color:#b7bdcd}.controls{display:flex;flex-wrap:wrap;gap:7px}.abilities{display:grid;gap:6px;margin-top:12px}.ability{text-align:left}.ability small{display:block;margin-top:2px;color:var(--muted);font-size:.78rem}.ability strong{font-size:.94rem}.action-log{border-top:1px solid var(--line);margin-top:14px;padding-top:11px}.action-log summary{cursor:pointer;font-size:.9rem}.action-log ol{font-size:.82rem;color:var(--muted);padding-left:23px;max-height:180px;overflow:auto}.action-log li{padding:3px 0}
.mobile-only,.mobile-board{display:none}footer{margin:2px auto 22px;max-width:1650px;padding:0 clamp(12px,3vw,42px);color:var(--muted);font-size:.82rem}
@media(max-width:940px){main{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.arena{grid-row:2;grid-column:1/-1}.hero h2{font-size:1.15rem}.hero-head,.inventory{padding:8px}.hero .board-panel{display:none}.mobile-only{display:block}.mobile-board{display:block;grid-row:3;grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.tabs{display:flex;gap:6px;padding:8px}.tabs button{flex:1}.dice{max-width:410px}.tokens{min-height:19px}}
@media(max-width:390px){.hero-head{gap:5px 9px}.hero h2{flex-basis:100%}.inventory{font-size:.76rem}.token{font-size:.75rem}}
.vitals{display:inline-flex;gap:12px;align-items:center;white-space:nowrap}
.board-open{display:block;padding:0;width:100%;background:transparent;border:0}
.leaflet{font-size:.8rem;padding-inline:7px}
.token-help{position:relative}.token-help button{background:transparent;padding:3px 5px;min-height:28px;font-size:inherit}
.token-note{display:block;margin:4px 0 0;line-height:1.4;color:var(--muted)}
.token-note[hidden]{display:none}
@media(hover:hover){.token-help:hover .token-note,.token-help:focus-within .token-note{display:block}}
dialog{color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1100px,96vw);max-width:none;padding:12px}
dialog::backdrop{background:#080a12dc}
.viewer-head,.viewer-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}.viewer-head h2{margin:0 auto 0 0;font-size:1.15rem}
.viewer-scroll{overflow:auto;height:65vh;touch-action:pan-x pan-y;background:#10121a;border-radius:7px}
.viewer-scroll img{display:block;max-width:none;height:auto;margin-inline:auto}
@media(max-width:940px){
  .hero-head{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
  .hero-head h2,.hero-head .vitals,.hero-head .tokens{grid-column:1}
  .hero-head .vitals{gap:clamp(6px,2vw,12px);font-size:clamp(.78rem,3.5vw,1rem)}
  .inventory{flex-wrap:wrap}
}
.match-setup{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.setup-seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.setup-seat{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:9px}
.setup-seat small,.setup-seat strong{display:block}
.setup-seat button{white-space:nowrap}
.setup-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setup-actions label{display:flex;align-items:center;gap:5px;font-size:.85rem;color:var(--muted)}
#hero-picker{width:min(520px,calc(100% - 24px));max-height:85dvh;padding:0;overflow:hidden}
#hero-picker[open]{display:flex;flex-direction:column}
body:has(#hero-picker[open]){overflow:hidden}
.picker-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.picker-head label{display:block;margin:10px 0 5px;color:var(--muted);font-size:.88rem}
#hero-search{width:100%;min-height:44px;padding:8px 10px;font:inherit;color:inherit;background:#10121a;border:1px solid #51566a;border-radius:8px}
#hero-search:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.picker-results{padding:12px 16px 16px;min-height:0;overflow:auto;overscroll-behavior:contain}
.picker-results details{border:1px solid var(--line);border-radius:9px}
.picker-results details+details{margin-top:8px}
.picker-results summary{padding:12px;cursor:pointer;font-weight:650}
.picker-heroes{display:grid;gap:5px;padding:0 8px 8px}
.picker-hero{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.picker-hero[hidden]{display:none}
.picker-hero[aria-current="true"]{border-color:var(--gold)}
.picker-hero small{color:var(--gold)}
#hero-no-results{margin:0;color:var(--muted)}
@media(max-width:800px){
  header>div{align-items:stretch;flex-direction:column}
  .match-setup{justify-content:space-between}
}
@media(max-width:560px){
  .setup-seats{width:100%}
  .setup-seat{flex-direction:column;align-items:stretch;justify-content:space-between}
  .setup-actions{width:100%;justify-content:space-between}
}
@media(hover:none) and (pointer:coarse){
  #hero-picker{inset:0;margin:0;width:100%;height:100dvh;max-height:none;border:0;border-radius:0}
}
.hand-panel{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.hand-panel h3{margin:0 0 8px;font-size:.95rem}
.hand-group h3{font-size:.85rem;margin:0 0 6px;color:var(--muted)}
.hand-group+.hand-group{margin-top:14px}
.hand-grid{display:grid;gap:6px}
.hand-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px}
.hand-card>button{text-align:left}
.hand-card small{color:var(--muted);display:block}
.card-command{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.card-command label{width:100%;font-size:.86rem}
.card-command select{max-width:100%;min-height:42px;width:100%;padding:4px;border-radius:7px}
.defence-choice{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.hand-tools{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#hand-dialog{width:min(520px,96vw);max-height:85dvh;overflow-y:auto}
.board-upgrades{padding:8px 12px;border-top:1px solid var(--line)}
.board-upgrades summary{cursor:pointer;font-size:.85rem}
.board-upgrades button{margin:6px 5px 0 0}
.income-note{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;font-size:.88rem}
.install-strip{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:0 auto;padding:6px clamp(10px,2.5vw,32px);max-width:1650px;color:var(--muted);font-size:.8rem}
.install-strip button{min-height:32px}
.token-actions{margin-top:12px}.token-actions strong{display:block;font-size:.85rem;margin-bottom:5px}
</style>
<link rel="manifest" href="./manifest.webmanifest">

<body>
<header>
 <div>
  <div><h1>Dice Throne</h1><small>Playtest 0.37.0</small></div>
  <section class="match-setup" aria-label="Match setup">
   <div class="setup-seats">
    <div class="setup-seat"><div><small>Player 1</small><strong id="setup-hero-0"></strong></div><button type="button" id="change-hero-0" aria-label="Change hero for Player 1" aria-describedby="setup-hero-0" aria-haspopup="dialog">Change hero</button></div>
    <div class="setup-seat"><div><small>Player 2</small><strong id="setup-hero-1"></strong></div><button type="button" id="change-hero-1" aria-label="Change hero for Player 2" aria-describedby="setup-hero-1" aria-haspopup="dialog">Change hero</button></div>
   </div>
   <div class="setup-actions"><label><input id="promos" type="checkbox"> Include promo cards</label><button id="reset" type="button">Start match</button></div>
  </section>
 </div>
</header>
<aside class="install-strip"><span role="status" id="offline-status">Preparing offline play…</span><button type="button" id="install-app" hidden>Install app</button></aside>
<main id="match"></main>
<dialog id="hero-picker" aria-labelledby="hero-picker-title">
 <div class="picker-head">
  <div class="viewer-head"><h2 id="hero-picker-title"></h2><form method="dialog"><button autofocus>Cancel</button></form></div>
  <label for="hero-search">Search by hero name</label>
  <input id="hero-search" type="search" autocomplete="off">
 </div>
 <div class="picker-results">
  <div id="hero-groups"></div>
  <p id="hero-no-results" role="status"></p>
 </div>
</dialog>
<dialog id="hand-dialog" aria-labelledby="hand-title">
 <div class="viewer-head"><h2 id="hand-title"></h2><form method="dialog"><button>Close hand</button></form></div>
 <div id="hand-content"></div>
</dialog>
<dialog id="viewer" aria-labelledby="viewer-title">
 <div class="viewer-head"><h2 id="viewer-title"></h2><form method="dialog"><button>Close</button></form></div>
 <div class="viewer-tools">
  <button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button>
  <button id="leaflet-front">Front</button><button id="leaflet-back">Back</button>
 </div>
 <div id="viewer-scroll" class="viewer-scroll"><img id="viewer-image" alt=""></div>
</dialog>
<footer>Local two-seat playtest · standard decks and legacy timing.</footer>
